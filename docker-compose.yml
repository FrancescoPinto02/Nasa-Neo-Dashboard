services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: nasa-neo-backend
    env_file:
      - ./apps/backend/.env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      LOG_LEVEL: INFO
      LOG_JSON: "false"
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend/app:/app/app:ro
      - backend-cache:/app/.cache
    command:
      - sh
      - -c
      - uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    container_name: nasa-neo-web
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: nasa-neo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  backend-cache:
  redis-data: